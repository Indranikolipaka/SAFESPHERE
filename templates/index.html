<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBVRR Login</title>
  
  <!-- Styles -->
  <style>
    /* Body & background */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: #f0f8ff; /* light playful background */
      position: relative;
    }

    /* Splash Screen */
#splash-card {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  overflow: hidden;
}

.splash-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: fadeSplash 3s forwards;
}

@keyframes fadeSplash {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; }
}

    /* Container for login card */
    .container {
      display: none; /* hidden initially */
      position: relative;
      z-index: 2; /* above bubbles */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Header logo */
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
    }

    .logo {
      max-width: 300px;
      height: auto;
      animation: logoBounce 1s ease forwards;
    }

    @keyframes logoBounce {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Login card */
    .login-card {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      opacity: 0;
      transform: translateY(30px);
      animation: cardAppear 1s ease 1s forwards;
      z-index: 2;
    }

    @keyframes cardAppear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-row {
      margin-bottom: 15px;
    }

    .form-row label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-row input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.3s ease;
      background-color: #2196f3;
      color: #fff;
      text-decoration: none;
    }

    .btn:hover {
      transform: scale(1.05);
      background-color: #4caf50;
    }

    /* Floating bubbles */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(173, 216, 230, 0.4);
      pointer-events: none;
      animation: floatUp linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
<div id="splash-card">
  <video class="splash-video" autoplay muted playsinline>
      <source src="{{ url_for('static', filename='splash.mp4') }}" type="video/mp4">

  </video>
</div>


  <!-- Main container -->
  <div class="container">
    <header>
      <img src="/static/logo.png" alt="RBVRR Logo" class="logo">
    </header>

    <main class="card login-card">
      <form action="/login" method="post" onsubmit="return validateLogin()">
        <div class="form-row">
          <label>Username</label>
          <input type="text" name="username" id="username" required>
        </div>
        <div class="form-row">
          <label>Password</label>
          <input type="password" name="password" id="password" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">Login</button>
          <a class="btn" href="/signup">Signup</a>
        </div>
      </form>
    </main>
  </div>

  <!-- Scripts -->
  <script>
    // Floating bubbles
    const numBubbles = 15;
    for (let i = 0; i < numBubbles; i++) {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      bubble.style.width = bubble.style.height = Math.random() * 50 + 20 + 'px';
      bubble.style.left = Math.random() * 100 + 'vw';
      bubble.style.animationDuration = (Math.random() * 5 + 5) + 's';
      bubble.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(bubble);
    }

    // Splash screen logic
    window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash-card').style.display = 'none';
    document.querySelector('.container').style.display = 'flex';
  }, 3000);  // match to your video duration
});


    // Example login validation
    function validateLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) {
        alert('Please enter username and password');
        return false;
      }
      return true;
    }
  </script>

</body>
</html>
