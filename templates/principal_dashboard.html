<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Principal Dashboard - SafeSphere</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/principal.css">
  <style>
    body { font-family: Arial, sans-serif; background: #fff0f5; }
    main { padding: 20px; max-height: calc(100vh - 80px); overflow-y: auto; }
    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f7f7f7; }
    .btn { padding: 4px 10px; border-radius: 4px; border: none; cursor: pointer; margin-right:4px; }
    .btn.accept { background-color:#28a745; color:white; }
    .btn.reject { background-color:#ffc107; color:black; }
    .btn.delete { background-color:#dc3545; color:white; }
    .btn:disabled { opacity:0.6; cursor:not-allowed; }
    .highlight { background-color: #d1ecf1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h2>Hello Principal of RBVRR Womens College</h2>
      <nav>
        <a href="/change_password" class="btn">Change Password</a>
        <a href="/logout" class="btn">Logout</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <h3>Complaints Forwarded by Teachers</h3>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Teacher</th>
              <th>Status</th>
              <th>Forwarded At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="forwarded-complaints-body">
            {% for c in forwarded_complaints %}
            <tr id="complaint-{{ c['id'] }}" class="{% if c['forwarded'] %}highlight{% endif %}">
              <td>{{ c['id'] }}</td>
              <td>{{ c['title'] }}</td>
              <td>{{ c['teacher_name'] }}</td>
              <td id="status-{{ c['id'] }}">{{ c['status'] }}</td>
              <td>{{ c['forwarded_at'] }}</td>
              <td>
                <button class="btn accept" data-id="{{ c['id'] }}" data-action="accept">Accept</button>
                <button class="btn reject" data-id="{{ c['id'] }}" data-action="reject">Reject</button>
                <button class="btn delete" data-id="{{ c['id'] }}" data-action="delete">Delete</button>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script>
    function handleComplaint(id, action){
      if(!confirm(`Are you sure you want to ${action} this complaint?`)) return;

      fetch(`/principal/complaint/${id}/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      })
      .then(res => res.json())
      .then(data => {
        if(data.success){
          const row = document.getElementById('complaint-' + id);
          if(action === 'delete') row.remove();
          else {
            row.querySelectorAll('button').forEach(b => b.disabled = true);
            row.style.backgroundColor = action === 'accept' ? '#d4edda' : '#fff3cd';
            document.getElementById('status-'+id).textContent = action==='accept' ? 'Accepted' : 'Rejected';
          }
        } else {
          alert('Error: ' + data.error);
        }
      })
      .catch(err => alert('Something went wrong.'));
    }

    document.querySelectorAll('button[data-id]').forEach(btn => {
      btn.addEventListener('click', function(){
        handleComplaint(this.dataset.id, this.dataset.action);
      });
    });
  </script>
</body>
</html>
