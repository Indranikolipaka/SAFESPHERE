<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - SafeSphere</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/teacher.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #004080;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }

        main {
            padding: 2rem;
        }

        #teacher-info {
            margin-bottom: 2rem;
            background: #fff;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        #schedule {
            background: #fff;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        #schedule ul {
            list-style-type: none;
            padding: 0;
        }

        #schedule ul li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <header>
        <h1>Teacher Dashboard</h1>
    </header>

    <main>
        <!-- Teacher Info -->
        <div id="teacher-info">
            <!-- Populated by JS -->
        </div>

        <!-- Teacher Subjects / Schedule -->
        <div id="schedule">
            <h3>Subjects Assigned</h3>
            <ul id="schedule-list">
                <!-- Populated by JS -->
            </ul>
        </div>
    </main>

    <script>
        // Safely pass Python variables to JS
        const teacher = {
            name: "{{ teacher_name }}",
            email: "{{ teacher_email }}",
            subjects: {{ subjects | tojson | safe }}
        };

        function populateDashboard() {
            // Populate teacher info
            const infoDiv = document.getElementById('teacher-info');
            infoDiv.innerHTML = `
                <h2>${teacher.name}</h2>
                <p>Email: ${teacher.email}</p>
            `;

            // Populate subjects list
            const scheduleList = document.getElementById('schedule-list');
            if (!teacher.subjects || teacher.subjects.length === 0) {
                scheduleList.innerHTML = "<li>No subjects assigned.</li>";
            } else {
                scheduleList.innerHTML = teacher.subjects
                    .map(sub => `<li>${sub}</li>`)
                    .join('');
            }
        }

        document.addEventListener('DOMContentLoaded', populateDashboard);
    </script>
</body>
</html>
