<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>RBVRR Login</title> 
  
  <!-- Styles -->
  <style> 
    /* Body & background */
    body { 
      margin: 0; 
      font-family: Arial, sans-serif; 
      overflow: hidden; 
      background: #f0f8ff;
      position: relative; 
    }

    /* Splash Screen */
    #splash-card {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      overflow: hidden;
    }

    .splash-video {
      width: 350px;        /* smaller video */
      height: auto;
      object-fit: contain; /* no zoom */
      animation: fadeSplash 3s forwards;
      z-index: 99999;
    }

    @keyframes fadeSplash {
      0% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

  </style>

  <!-- External CSS -->
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/login.css">

  <!-- JS -->
  <script src="/static/js/main.js" defer></script>

  <style>
    /* Popup animation */
    .popup { animation: pop 700ms ease; }

    @keyframes pop { 
      from { transform: scale(0.6); opacity:0 } 
      to { transform: scale(1); opacity:1 } 
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
      z-index: 2;
    }

    .logo {
      max-width: 800px;
      animation: logoBounce 1s ease forwards;
    }

    @keyframes logoBounce {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .login-card {
      opacity: 0;
      transform: translateY(30px);
      animation: cardAppear 1s ease 1s forwards;
      z-index: 2;
    }

    @keyframes cardAppear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .btn:hover {
      transform: scale(1.05);
      background-color: #4caf50;
      color: #fff;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(173, 216, 230, 0.4);
      pointer-events: none;
      animation: floatUp linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Center everything in the container */
.container {
  display: flex;
  flex-direction: column;   /* logo on top, login below */
  justify-content: center;
  align-items: center;
  height: 100vh;            /* full screen center */
}

/* Make the logo bigger */
.logo {
  width: 600px;   /* adjust as you want */
  max-width: 90%;
  height: auto;
}

/* Center the login card */
.login-card {
  margin-top: 20px;
  width: 400px;   /* good size for form */
}

  </style>
</head>

<body>

  <!-- Splash Screen -->
  <div id="splash-card">
    <video class="splash-video" autoplay muted playsinline>
      <source src="{{ url_for('static', filename='splash.mp4') }}" type="video/mp4">
    </video>
  </div>

  <div class="container popup">
    <header>
      <img src="/static/logo.png" alt="RBVRR Logo" class="logo">
    </header>

    <main class="card login-card">
      <form action="/login" method="post" onsubmit="return validateLogin()">
        <div class="form-row">
          <label>Username</label>
          <input type="text" name="username" id="username" required>
        </div>
        <div class="form-row">
          <label>Password</label>
          <input type="password" name="password" id="password" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">Login</button>
          <a class="btn" href="/signup">Signup</a>
        </div>
      </form>
    </main>
  </div>

  <!-- Floating bubbles script -->
  <script>
    const numBubbles = 15;
    for (let i = 0; i < numBubbles; i++) {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      bubble.style.width = bubble.style.height = Math.random() * 50 + 20 + 'px';
      bubble.style.left = Math.random() * 100 + 'vw';
      bubble.style.animationDuration = (Math.random() * 5 + 5) + 's';
      bubble.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(bubble);
    }

    // Splash logic
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splash-card').style.display = 'none';
        document.querySelector('.container').style.display = 'flex';
      }, 3000);
    });
  </script>

</body>
</html>
