<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - SafeSphere</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/teacher.css">
    <style>
        /* Sidebar */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .sidebar {
            width: 220px;
            height: 100vh;
            position: fixed;
            background-color: #2c3e50;
            color: white;
            padding-top: 20px;
        }
        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .sidebar a {
            display: block;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            margin-bottom: 5px;
        }
        .sidebar a:hover {
            background-color: #34495e;
        }

        /* Main content */
        .main {
            margin-left: 220px;
            padding: 20px;
        }

        .card {
            background: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #schedule-list li {
            margin-bottom: 5px;
        }

        .logout-btn {
            display: block;
            width: calc(100% - 40px);
            margin: 20px auto 0 auto;
            padding: 10px;
            text-align: center;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .logout-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>SafeSphere</h2>
        <a href="#">Dashboard</a>
        <a href="#">Attendance</a>
        <a href="#">Assignments</a>
        <a href="#">Messages</a>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>

    <div class="main">
        <div id="teacher-info" class="card">
            <!-- Teacher info populated by JS -->
        </div>

        <div class="card">
            <h3>Subjects</h3>
            <ul id="schedule-list">
                <!-- Subjects populated by JS -->
            </ul>
        </div>
    </div>

    <script>
    // Correct way to pass Python variables
    const teacher = {
        name: "{{ teacher_name }}",
        email: "{{ teacher_email }}",
        subjects: {{ subjects | tojson | safe }}
    };

    function populateDashboard() {
        const infoDiv = document.getElementById('teacher-info');
        infoDiv.innerHTML = `
            <h2>${teacher.name}</h2>
            <p>Email: ${teacher.email}</p>
        `;

        const scheduleList = document.getElementById('schedule-list');
        if (!teacher.subjects || teacher.subjects.length === 0) {
            scheduleList.innerHTML = "<li>No subjects assigned.</li>";
        } else {
            scheduleList.innerHTML = teacher.subjects.map(sub => `<li>${sub}</li>`).join('');
        }
    }

    document.addEventListener('DOMContentLoaded', populateDashboard);
</script>

</body>
</html>
